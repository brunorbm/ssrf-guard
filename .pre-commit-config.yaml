repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: semgrep-test
        name: semgrep --test
        entry: semgrep --test semgrep/
        language: system
        pass_filenames: false
        files: ^semgrep/
      - id: bypass-table
        name: README bypass table is current
        entry: python scripts/render_catalog.py --check
        language: system
        pass_filenames: false
        files: ^(tests/test_bypass_catalog\.py|README\.md|scripts/render_catalog\.py)$
