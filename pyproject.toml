[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ssrf-guard"
dynamic = ["version"]
description = "Resolve-and-pin protection against Server-Side Request Forgery (SSRF) for Python HTTP clients."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bruno Rangel Borges Marchetti", email = "brunorbm@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["ssrf", "security", "dns-rebinding", "httpx", "requests"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.optional-dependencies]
httpx = ["httpx>=0.27,<1", "httpcore>=1.0,<2", "anyio>=4"]
requests = ["requests>=2.32,<3", "urllib3>=2,<3"]
dev = [
    "ssrf-guard[httpx,requests]",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "trustme>=1.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[tool.hatch.version]
path = "src/ssrf_guard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ssrf_guard"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["ssrf_guard"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$", "raise NotImplementedError"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "fuzz", "scripts"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["trustme", "atheris"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF", "PT", "TRY", "PL"]
ignore = [
    "TRY003",  # long messages in exception constructors are intentional
    "PLR2004", # magic values are fine in a parser
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# Tests feed confusable Unicode on purpose: that is what they are testing.
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S113", "S310", "PLC0415", "BLE001",
              "TRY", "RUF001", "RUF003", "PT017"]
"src/ssrf_guard/_host.py" = ["RUF002"]
"fuzz/**" = ["S101", "BLE001", "PLC0415"]
"scripts/**" = ["S101"]
"semgrep/**" = ["ALL"]
